<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TCPRI · Assign task</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container narrow"><h1>Assign a task</h1><form class="card form-card" method="post" th:action="@{/tasks}" th:object="${form}"><label>Title<input th:field="*{title}" required maxlength="180"></label><label>Description<textarea th:field="*{description}" rows="4"></textarea></label><label>Due date<input type="date" th:field="*{dueDate}"></label><label>Assign to<select th:field="*{assigneeId}" required><option value="">Choose a member</option><option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name + ' (' + m.email + ')'}"></option></select></label><button type="submit">Assign task</button><a th:href="@{/tasks}">Cancel</a></form></main></body></html>
