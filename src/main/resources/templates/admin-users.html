<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TCPRI · Users</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><strong>TCPRI</strong><div><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/tasks}">Tasks</a><a th:href="@{/posts}">Content</a><form method="post" th:action="@{/logout}"><button class="secondary" type="submit">Sign out</button></form></div></nav><main class="container"><h1>User administration</h1><p class="success" th:if="${message}" th:text="${message}"></p><h2>Pending registrations</h2><p th:if="${#lists.isEmpty(pendingUsers)}">No pending registrations.</p><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Requested</th><th>Action</th></tr></thead><tbody><tr th:each="u : ${pendingUsers}"><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.createdAt}"></td><td class="actions"><form method="post" th:action="@{/admin/users/{id}/approve(id=${u.id})}"><button>Approve</button></form><form method="post" th:action="@{/admin/users/{id}/reject(id=${u.id})}"><button class="danger">Reject</button></form></td></tr></tbody></table></div><h2>All accounts</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Role</th><th>Update role</th></tr></thead><tbody><tr th:each="u : ${allUsers}"><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.status}"></td><td th:text="${u.role}"></td><td><form class="inline" method="post" th:action="@{/admin/users/{id}/role(id=${u.id})}"><select name="role"><option th:each="r : ${T(org.tcpri.workspace.user.Role).values()}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option></select><button class="secondary">Save</button></form></td></tr></tbody></table></div><p class="notice">Before production, add a last-administrator safeguard, confirmation for role changes, and audit logs.</p></main></body></html>
