<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TCPRI | Choose password</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-page"><main class="auth auth-card"><a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark">T</span><span><strong>TCPRI</strong><small>TEAM WORKSPACE</small></span></a><p class="eyebrow auth-eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/reset-password}"><input type="hidden" name="token" th:value="${token}"><label>New password<input type="password" name="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><label>Confirm password<input type="password" name="confirmPassword" minlength="12" maxlength="72" autocomplete="new-password" required></label><button class="primary-button full-width" type="submit">Save new password</button></form></main></body></html>
