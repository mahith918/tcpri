<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TCPRI · New post</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container narrow"><h1>Create content draft</h1><form class="card form-card" method="post" th:action="@{/posts}" th:object="${form}"><label>Internal title<input th:field="*{title}" required maxlength="180"></label><label>Caption<textarea th:field="*{caption}" rows="6"></textarea></label><label>Platform<select th:field="*{platform}" required><option value="">Choose platform</option><option th:each="p : ${platforms}" th:value="${p}" th:text="${p}"></option></select></label><label>Planned date and time<input type="datetime-local" th:field="*{plannedAt}"></label><button type="submit">Save draft</button><a th:href="@{/posts}">Cancel</a></form></main></body></html>
