<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TCPRI · Tasks</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><strong>TCPRI</strong><div><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/posts}">Content</a><form method="post" th:action="@{/logout}"><button class="secondary">Sign out</button></form></div></nav><main class="container"><h1>Team tasks</h1><p class="success" th:if="${message}" th:text="${message}"></p><p><a class="button-link" th:if="${canAssign}" th:href="@{/tasks/new}">+ Assign task</a></p><div class="table-wrap"><table><thead><tr><th>Task</th><th>Assignee</th><th>Due date</th><th>Status</th><th>Update</th></tr></thead><tbody><tr th:each="t : ${tasks}"><td><strong th:text="${t.title}"></strong><br><small th:text="${t.description}"></small></td><td th:text="${t.assignee.name}"></td><td th:text="${t.dueDate}"></td><td th:text="${t.status}"></td><td><form class="inline" method="post" th:action="@{/tasks/{id}/status(id=${t.id})}"><select name="status"><option value="TODO" th:selected="${t.status.name() == 'TODO'}">To do</option><option value="IN_PROGRESS" th:selected="${t.status.name() == 'IN_PROGRESS'}">In progress</option><option value="DONE" th:selected="${t.status.name() == 'DONE'}">Done</option></select><button class="secondary">Update</button></form></td></tr></tbody></table></div></main></body></html>
<script th:if="${canDelete}" th:inline="javascript">
  var csrfToken = /*[[${_csrf.token}]]*/ '';
  var csrfParameter = /*[[${_csrf.parameterName}]]*/ '_csrf';
  document.querySelectorAll('tbody tr').forEach(function (row) {
    var taskId = row.querySelector('form[action*="/tasks/"]')?.action.match(/tasks\/(\d+)/)?.[1];
    if (!taskId) return;
    var cell = document.createElement('td');
    cell.innerHTML = '<form method="post" action="/tasks/' + taskId + '/delete" onsubmit="return confirm(\'Delete this task?\');"><button class="danger" type="submit">Delete</button></form>';
    var deleteForm = cell.querySelector('form');
    var csrfInput = document.createElement('input');
    csrfInput.type = 'hidden';
    csrfInput.name = csrfParameter;
    csrfInput.value = csrfToken;
    deleteForm.appendChild(csrfInput);
    row.appendChild(cell);
  });
  var header = document.createElement('th');
  header.textContent = 'Admin action';
  document.querySelector('thead tr').appendChild(header);
</script>
