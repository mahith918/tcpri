spring.application.name=TCPRI-Team-Workspace
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/tcpri-workspace;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.thymeleaf.cache=false

# Set these environment variables before first startup to create the initial administrator.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Initial Administrator}

# SMTP email settings. Configure these as environment variables before enabling email.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:}
app.mail.admin=${ADMIN_NOTIFICATION_EMAIL:}
app.base-url=${APP_BASE_URL:http://localhost:8080}
