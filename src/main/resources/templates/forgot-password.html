<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TCPRI | Reset password</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-page"><main class="auth auth-card"><a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark">T</span><span><strong>TCPRI</strong><small>TEAM WORKSPACE</small></span></a><p class="eyebrow auth-eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password</h1><p class="muted">Enter your approved account email. If it exists, we will send a reset link.</p><p class="success" th:if="${param.sent}">If that account is approved, a reset link has been sent.</p><form method="post" th:action="@{/forgot-password}"><label>Email address<input type="email" name="email" autocomplete="email" required></label><button class="primary-button full-width" type="submit">Send reset link</button></form><p class="auth-foot"><a th:href="@{/login}">Back to sign in</a></p></main></body></html>
