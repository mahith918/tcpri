<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TCPRI · Content</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><nav><strong>TCPRI</strong><div><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/tasks}">Tasks</a><form method="post" th:action="@{/logout}"><button class="secondary">Sign out</button></form></div></nav><main class="container"><h1>Social content</h1><p class="success" th:if="${message}" th:text="${message}"></p><p><a class="button-link" th:href="@{/posts/new}">+ Create draft</a></p><div class="table-wrap"><table><thead><tr><th>Title / Caption</th><th>Platform</th><th>Planned date</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="p : ${posts}"><td><strong th:text="${p.title}"></strong><br><small th:text="${p.caption}"></small></td><td th:text="${p.platform}"></td><td th:text="${p.plannedAt}"></td><td th:text="${p.status}"></td><td class="actions"><form th:if="${p.status.name() == 'DRAFT' or p.status.name() == 'REJECTED'}" method="post" th:action="@{/posts/{id}/submit(id=${p.id})}"><button>Submit for review</button></form><form th:if="${canReview and p.status.name() == 'SUBMITTED'}" method="post" th:action="@{/posts/{id}/review(id=${p.id})}"><input type="hidden" name="approve" value="true"><button>Approve</button></form><form th:if="${canReview and p.status.name() == 'SUBMITTED'}" method="post" th:action="@{/posts/{id}/review(id=${p.id})}"><input type="hidden" name="approve" value="false"><button class="danger">Request changes</button></form></td></tr></tbody></table></div><p class="notice">Approved means internally approved, not yet published to Instagram, Facebook, or LinkedIn.</p></main></body></html>
