<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TCPRI | Request access</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-page"><main class="auth auth-card"><a class="brand auth-brand" th:href="@{/login}"><span class="brand-mark">T</span><span><strong>TCPRI</strong><small>TEAM WORKSPACE</small></span></a><p class="eyebrow auth-eyebrow">TEAM ACCESS</p><h1>Request an account</h1><p class="muted">Create your request. TCPRI administration must approve access before you can sign in.</p><p class="error" th:if="${registrationError}" th:text="${registrationError}"></p><form method="post" th:action="@{/register}" th:object="${form}"><label>Full name<input th:field="*{name}" autocomplete="name" placeholder="Your full name" required maxlength="120"></label><small class="error" th:errors="*{name}"></small><label>Work email<input type="email" th:field="*{email}" autocomplete="email" placeholder="you@organization.org" required maxlength="190"></label><small class="error" th:errors="*{email}"></small><label>Password <span class="label-hint">12 characters minimum</span><input type="password" th:field="*{password}" required minlength="12" maxlength="72" autocomplete="new-password" placeholder="Create a strong password"></label><small class="error" th:errors="*{password}"></small><button class="primary-button full-width" type="submit">Submit access request <span>→</span></button></form><p class="auth-foot">Already approved? <a th:href="@{/login}">Sign in</a></p><p class="security-foot">TCPRI internal portal · Your request is reviewed by an administrator</p></main></body></html>
